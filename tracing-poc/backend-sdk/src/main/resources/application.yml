server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  tomcat:
    relaxed-query-chars: '|,{,},[,]'

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:tracing-poc-backend-sdk}

otel:
  service:
    name: ${OTEL_SERVICE_NAME:${spring.application.name}}
  resource:
    attributes:
      service.namespace: ${OTEL_SERVICE_NAMESPACE:tracing-poc}
      deployment.environment.name: ${OTEL_DEPLOYMENT_ENVIRONMENT:local}
  traces:
    exporter: otlp
  metrics:
    exporter: none
  logs:
    exporter: none
  propagators: tracecontext,baggage
  exporter:
    otlp:
      protocol: grpc
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://alloy:4317}

logging:
  level:
    io.opentelemetry: INFO
    io.opentelemetry.exporter.otlp: INFO
    io.grpc: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p traceId=%X{trace_id:-} spanId=%X{span_id:-} [%thread] %logger{36} - %msg%n"
