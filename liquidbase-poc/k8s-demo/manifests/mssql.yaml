apiVersion: v1
kind: Service
metadata:
  name: mssql
  namespace: liquibase-poc
spec:
  selector:
    app: mssql
  ports:
    - name: tds
      port: 1433
      targetPort: 1433
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mssql
  namespace: liquibase-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mssql
  template:
    metadata:
      labels:
        app: mssql
    spec:
      containers:
        - name: mssql
          # SQL Server 2022 is amd64-only. On Apple Silicon kind clusters this
          # only works if Docker Desktop has Rosetta emulation enabled
          # (Settings → General → "Use Rosetta..."). Boot under Rosetta is ~60s.
          image: mcr.microsoft.com/mssql/server:2022-latest
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: "Developer"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          ports:
            - containerPort: 1433
          readinessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 20
            periodSeconds: 5
          # emptyDir — data is ephemeral. Fine for the demo. Swap to a PVC for anything real.
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
      volumes:
        - name: data
          emptyDir: {}
