# Envsubst template — apply with: envsubst < k8s/dynatrace-secret.yaml | kubectl apply -f -
# setup.sh creates this secret automatically from DT_API_TOKEN and DT_DATA_INGEST_TOKEN env vars.
apiVersion: v1
kind: Secret
metadata:
  name: dynakube
  namespace: dynatrace
type: Opaque
stringData:
  apiToken: ${DT_API_TOKEN}
  dataIngestToken: ${DT_DATA_INGEST_TOKEN}