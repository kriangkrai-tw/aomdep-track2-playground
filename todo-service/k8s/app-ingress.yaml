apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-service-ingress
  namespace: todo-app
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: todo-app.local
      http:
        paths:
          - path: /api/todos
            pathType: Prefix
            backend:
              service:
                name: todo-service
                port:
                  number: 80
