# Fluent Bit Helm values — envsubst substitutes ${DT_ENV_ID} and ${DT_API_TOKEN}
# before this file is passed to `helm install`.

daemonSetVolumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers

daemonSetVolumeMounts:
  - name: varlog
    mountPath: /var/log
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true

config:
  service: |
    [SERVICE]
        Flush         5
        Daemon        Off
        Log_Level     warn
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        multiline.parser  docker, cri
        Tag               kube.*
        Refresh_Interval  5
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        DB                /var/log/flb_kube.db

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Annotations         Off
        Labels              Off

    [FILTER]
        Name    grep
        Match   kube.*
        Exclude $kubernetes.namespace_name ^(logging|dynatrace|kube-system)$

    # Flatten kubernetes nested object → top-level k8s.* string fields
    # Dynatrace Log Ingest API rejects nested JSON objects as attribute values
    [FILTER]
        Name         nest
        Match        kube.*
        Operation    lift
        Nested_under kubernetes
        Add_prefix   k8s.

    # Ensure 'content' field exists (required by Dynatrace Log Ingest API).
    # JSON logs (logstash-logback-encoder) have 'message'; plain-text logs have 'log'.
    [FILTER]
        Name    modify
        Match   kube.*
        Copy    message content

    [FILTER]
        Name    modify
        Match   kube.*
        Copy    log content

  outputs: |
    [OUTPUT]
        Name                     http
        Match                    kube.*
        Host                     ${DT_ENV_ID}.live.dynatrace.com
        Port                     443
        URI                      /api/v2/logs/ingest
        Format                   json
        json_date_key            timestamp
        json_date_format         iso8601
        Allow_Duplicated_Headers false
        Header                   Content-Type application/json; charset=utf-8
        Header                   Authorization Api-Token ${DT_API_TOKEN}
        tls                      On
        tls.verify               On
        Retry_Limit              5

tolerations:
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

serviceAccount:
  create: true

rbac:
  create: true
  nodeAccess: true
